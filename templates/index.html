<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>post box</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="header">
    <h1>post box</h1>
    <p>チームで育てる小さなWebアプリ</p>
  </header>

  <main>
    <!-- 左カラム：投票機能 -->
    <section class="column">
      <h2>投票機能</h2>
      <div id="poll-container"></div>
    </section>

    <!-- 中央カラム：投稿機能（元のフォーム要素IDを完全維持） -->
    <section class="column">
      <h2>投稿機能</h2>
      <form id="form">
        <input id="name" maxlength="30" placeholder="Nickname" required>
        <textarea id="message" maxlength="300" placeholder="Message" required></textarea>
        
        <!-- ▼ ここに追加（28行目〜30行目として挿入） ▼ -->
        <div style="text-align: right; font-size: 0.85em; color: #666; margin-bottom: 8px;">
          <span id="char-count">0</span> / 300
        </div>
        
        <button>投稿</button>
      </form>
      <p id="status"></p>
      <section id="messages"></section>
    </section>

    <!-- 右カラム：ブックマーク一覧機能 -->
    <section class="column">
      <h2>ブックマーク一覧</h2>
      <section id="bookmarks"></section>
    </section>

    <section class="column calendar-column">
      <h2>カレンダー</h2>
      <div class="calendar-layout">
        <section class="calendar-panel" aria-label="予定カレンダー">
          <div class="calendar-toolbar">
            <button type="button" id="calendar-prev" class="calendar-nav" aria-label="前の月">‹</button>
            <h3 id="calendar-month" aria-live="polite"></h3>
            <button type="button" id="calendar-next" class="calendar-nav" aria-label="次の月">›</button>
          </div>
          <div class="calendar-grid calendar-weekdays" aria-hidden="true">
            <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
          </div>
          <div id="calendar-grid" class="calendar-grid" role="group" aria-label="日付"></div>
        </section>

        <section class="calendar-details">
          <h3 id="selected-date-heading"></h3>
          <form id="event-form">
            <label for="event-date">日付</label>
            <input id="event-date" type="date" required>
            <label for="event-title">予定</label>
            <input id="event-title" type="text" maxlength="100" placeholder="予定を入力" required>
            <button type="submit">予定を追加</button>
          </form>
          <p id="event-status" role="status" aria-live="polite"></p>
          <div id="event-list" aria-live="polite"></div>
        </section>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
